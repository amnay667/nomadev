<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Argus — Live Camera Vision Engine</title>
  <meta name="description" content="Real-time, on-device virtual camera: background blur/green-screen/replace, face mesh, hand-tracked particle trails, and gesture control. Nothing ever leaves your browser." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👁️</text></svg>" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #05060a;
      --panel: #0d0f16f0;
      --line: #262b3a;
      --accent: #5eead4;
      --accent-2: #f472b6;
      --text: #e6e9f0;
      --text-dim: #8790a8;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 0%, #131726 0%, #05060a 70%);
    }
    .stage {
      position: relative;
      width: min(100vw, 177.7vh);
      height: min(100vh, 56.25vw);
      max-width: 1280px;
      max-height: 720px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 0 0 1px var(--line), 0 30px 80px -20px #000c;
      background: #000;
    }
    /* All three layers live inside #frame-wrapper so Auto Frame can pan/zoom
       the video, face mesh, particles, and ink together with one CSS
       transform -- they stay in perfect registration for free. */
    #frame-wrapper {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
      will-change: transform;
    }
    canvas.layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #gl-canvas { z-index: 1; }
    #overlay-canvas { z-index: 2; pointer-events: none; }
    #draw-canvas { z-index: 3; pointer-events: none; }

    video#source {
      position: absolute;
      width: 1px; height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .hud {
      position: absolute;
      z-index: 5;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }
    #hud-top {
      top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 12px;
    }
    .badge {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      color: var(--text-dim);
      backdrop-filter: blur(6px);
    }
    .badge b { color: var(--accent); font-weight: 600; }
    .badge.rec { color: var(--accent-2); }
    .dot {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent-2); margin-right: 6px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

    #panel {
      position: absolute;
      z-index: 6;
      bottom: 12px; left: 12px; right: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      padding: 10px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      pointer-events: auto;
    }
    .group {
      display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
      padding-right: 10px;
      border-right: 1px solid var(--line);
    }
    .group:last-child { border-right: none; }
    .label {
      font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
      color: var(--text-dim); margin-right: 4px;
    }
    button {
      font: inherit;
      font-size: 12px;
      color: var(--text);
      background: #1a1e2b;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 6px 10px;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
      white-space: nowrap;
    }
    button:hover { background: #232838; border-color: #3a4258; }
    button.active {
      background: var(--accent);
      color: #04211c;
      border-color: var(--accent);
      font-weight: 600;
    }
    button.toggle.on {
      background: var(--accent-2);
      color: #2a0a17;
      border-color: var(--accent-2);
      font-weight: 600;
    }
    button#btn-record.recording {
      background: #ef4444;
      border-color: #ef4444;
      color: #2a0505;
      font-weight: 600;
      animation: pulse 1.1s ease-in-out infinite;
    }
    button.swatch {
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid var(--line);
    }
    button.swatch.active {
      border-color: var(--text);
      box-shadow: 0 0 0 2px var(--bg);
    }
    #status {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: #05060af5;
      text-align: center;
      padding: 24px;
    }
    #status.hidden { display: none; }
    #status h1 {
      font-size: 20px; margin: 0; letter-spacing: .02em;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    #status p { margin: 0; color: var(--text-dim); font-size: 13px; max-width: 440px; }
    #status button { padding: 10px 22px; font-size: 14px; }
    .spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid var(--line); border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
      display: none;
    }
    .spinner.show { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app">
    <div class="stage">
      <video id="source" autoplay playsinline muted></video>
      <div id="frame-wrapper">
        <canvas id="gl-canvas" class="layer"></canvas>
        <canvas id="overlay-canvas" class="layer"></canvas>
        <canvas id="draw-canvas" class="layer"></canvas>
      </div>

      <div class="hud" id="hud-top">
        <div class="badge rec" id="rec-badge"><span class="dot"></span>LIVE · ON-DEVICE ONLY</div>
        <div class="badge" id="gesture-badge" style="display:none;">✋ --</div>
        <div class="badge" id="fps-badge">-- fps</div>
      </div>

      <div id="panel">
        <div class="group" id="vision-group">
          <span class="label">Vision</span>
        </div>
        <div class="group" id="background-group">
          <span class="label">Background</span>
        </div>
        <div class="group" id="draw-group">
          <span class="label">Draw</span>
          <button id="btn-draw-clear">🧹 Clear</button>
        </div>
        <div class="group" id="action-group">
          <span class="label">Capture</span>
          <button id="btn-snapshot">📸 Snapshot</button>
          <button id="btn-record">⏺ Record</button>
        </div>
      </div>
      <input type="file" id="bg-image-input" accept="image/*" style="display:none;" />

      <div id="status">
        <div class="spinner" id="status-spinner"></div>
        <h1>ARGUS — Live Vision Engine</h1>
        <p id="status-text">Real-time background blur / green-screen / replace, face mesh, pinch-to-draw, and
          hands-free gesture control — all computed on-device. Nothing is ever uploaded. Click start and allow
          camera access.</p>
        <button id="btn-start">▶ Start Camera</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
